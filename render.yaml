services:
  - type: web
    name: ai-website-builder
    runtime: node
    rootDir: my-ai-builder/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NETLIFY_TOKEN
        sync: false
    disk:
      name: database
      mountPath: /data
      sizeGB: 1
