<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Website Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- ── SIDEBAR ── -->
    <div class="sidebar">

      <!-- User info at top -->
      <div class="sidebar-user">
        <div class="user-avatar">🤖</div>
        <div class="user-info">
          <span id="userEmail" class="user-email">Loading...</span>
          <span id="userRole"  class="user-role">user</span>
        </div>
        <button class="exit-btn" onclick="logout()" title="Logout">⏻</button>
      </div>

      <!-- New project button -->
      <div class="sidebar-actions">
        <button class="new-project-btn" onclick="startNewProject()">+ New Project</button>
      </div>

      <!-- Projects label -->
      <div class="sidebar-label">MY PROJECTS</div>

      <!-- Projects list -->
      <div id="projectsList" class="projects-list">
        <p class="empty-msg">No projects yet.<br/>Generate your first website!</p>
      </div>

    </div>

    <!-- ── MAIN AREA ── -->
    <div class="main">

      <!-- LEFT PANEL: prompt -->
      <div class="panel left-panel">
        <h1>🤖 AI Website Builder</h1>
        <p class="subtitle">Describe your website and it will be built instantly</p>

        <textarea
          id="promptInput"
          placeholder="Example: Make me a restaurant website with a menu, about section and contact form."
          rows="6"
        ></textarea>

        <div class="buttons">
          <button id="generateBtn" onclick="generateWebsite()">✨ Generate</button>
          <button id="modifyBtn"   onclick="modifyWebsite()" disabled>🔧 Modify</button>
        </div>

        <div id="statusMessage" class="status hidden"></div>
        <div id="explanation"   class="explanation hidden"></div>
        <div id="chatHistory"   class="chat-history"></div>
      </div>

      <!-- RIGHT PANEL: preview + code -->
      <div class="panel right-panel">

        <div class="preview-header">
          <span id="currentProjectName">Live Preview</span>
          <div class="header-actions">
            <div class="view-toggle">
              <button class="toggle-btn active" id="previewToggle" onclick="switchView('preview')">👁 Preview</button>
              <button class="toggle-btn" id="codeToggle" onclick="switchView('code')" disabled>&lt;/&gt; Code</button>
            </div>
            <button id="downloadBtn" onclick="downloadCode()" disabled>⬇️ Download</button>
          </div>
        </div>

        <!-- Preview -->
        <div id="previewView" style="flex:1;display:flex;flex-direction:column;">
          <iframe id="previewFrame" title="Website Preview"></iframe>
        </div>

        <!-- Code view -->
        <div id="codeView" class="hidden" style="flex:1;display:flex;flex-direction:column;background:#0d1117;overflow:hidden;">
          <div class="code-tabs">
            <button class="code-tab active" onclick="switchCodeTab('html')">HTML</button>
            <button class="code-tab"        onclick="switchCodeTab('css')">CSS</button>
            <button class="code-tab"        onclick="switchCodeTab('js')">JavaScript</button>
            <button class="copy-btn"        onclick="copyCode()">📋 Copy</button>
          </div>
          <div class="code-content">
            <pre id="codeDisplay"></pre>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
